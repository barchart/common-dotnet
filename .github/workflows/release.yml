name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Test and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Barchart.Common.sln

      - name: Test
        run: dotnet test Barchart.Common.sln --configuration Release --no-restore

      - name: Pack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f ".releases/${VERSION}.md"

          dotnet pack Barchart.Common/Barchart.Common.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="${VERSION}" \
            --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-package
          path: artifacts/*.nupkg

  sign:
    name: Sign package
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: unsigned-package
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install signing tools
        shell: pwsh
        run: |
          dotnet tool install --tool-path tools --version 0.9.1-beta.26431.1 sign
          dotnet tool install --tool-path tools --version 0.1.1 Knapcode.CertificateExtractor

      - name: Login to Azure
        uses: azure/login@v3
        with:
          allow-no-subscriptions: true
          enable-AzPSSession: true
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Sign package
        uses: azure/powershell@v3
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        with:
          azPSVersion: latest
          inlineScript: |
            ./tools/sign code artifact-signing *.nupkg `
              -ase $env:SIGNING_ENDPOINT `
              -asa $env:SIGNING_ACCOUNT `
              -ascp $env:SIGNING_CERTIFICATE_PROFILE `
              -act azure-powershell `
              --base-directory "${{ github.workspace }}/artifacts"

      - name: Verify package signature
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/*.nupkg
          dotnet nuget verify --all $package.FullName

      - name: Extract public signing certificate
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts -Filter *.nupkg | Select-Object -First 1
          ./tools/nuget-cert-extractor `
            --file $package.FullName `
            --output certificates `
            --author `
            --code-signing `
            --leaf

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: signed-package
          path: artifacts/*.nupkg

      - name: Upload public signing certificate
        uses: actions/upload-artifact@v4
        with:
          name: signing-certificate
          path: certificates/*

  publish:
    name: Publish package
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@v4
        with:
          name: signed-package
          path: artifacts

      - name: Authenticate with NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
